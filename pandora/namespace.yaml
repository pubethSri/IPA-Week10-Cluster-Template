# The load generator runs in its own namespace, outside yours, so it does not
# spend your ResourceQuota.
apiVersion: v1
kind: Namespace
metadata:
  name: pandora
  labels:
    app.kubernetes.io/name: pandora
    app.kubernetes.io/part-of: epimetheus-lab
    # Marks this as the measuring instrument, not part of your deployment.
    epimetheus.lab/sealed: "true"
