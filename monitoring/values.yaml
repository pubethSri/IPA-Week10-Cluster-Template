# This is the `prometheus` chart, NOT `kube-prometheus-stack`. That one brings an
# operator and a large default rule set, and a 2 vCPU / 4 GB node will not carry it.

server:
  # Must end up named `prometheus` on port 9090 — the load generator's address for
  # it is frozen. Left alone the chart would use `<release>-server` on port 80.
  # Check with `kubectl -n monitoring get svc`.
  fullnameOverride: prometheus
  service:
    servicePort: 9090

    # NodePort because Grafana runs outside the cluster, on your rancher VM, and a
    # ClusterIP address only exists inside. The other NodePorts are taken, so
    # Prometheus uses this one.
    type: NodePort
    nodePort: 30909

  # Both are needed. The toleration gets these pods PAST worker2's taint; the
  # nodeSelector is what puts them there.
  nodeSelector:
    kubernetes.io/hostname: worker2
  tolerations:
    - key: dedicated
      operator: Equal
      value: infra
      effect: NoSchedule

  # A run is minutes, not days. Lower this if worker2 runs short of memory.
  retention: 2h

  persistentVolume:
    # Off: a run's evidence lives in its report, not in Prometheus.
    enabled: false

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      memory: "768Mi"

  global:
    # The load generator expects exactly 5s. A mismatch makes some run-report
    # values interpolation rather than measurement. Leave it alone.
    scrape_interval: 5s
    evaluation_interval: 5s

    # Required. The chart's default timeout is 10s, and Prometheus refuses to
    # start when the timeout exceeds the interval — overriding the interval
    # alone leaves the 10s behind and the server CrashLoopBackOffs.
    scrape_timeout: 5s

# ---- components not installed ---------------------------------------------
alertmanager:
  # Nothing pages anybody in a teaching lab, and it costs memory this node lacks.
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  # A DaemonSet, so node-level CPU and memory for both sides of the split.
  enabled: true

kube-state-metrics:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: worker2
  tolerations:
    - key: dedicated
      operator: Equal
      value: infra
      effect: NoSchedule

# ---- what gets scraped -----------------------------------------------------
#
# **One of the three jobs is missing, and writing it is yours.** Stage 3.1 of
# the lab sheet walks you through it.
#
# **Do not add a cAdvisor job here.** The chart already ships one
# (`kubernetes-nodes-cadvisor`) and a second would duplicate every container
# series. That job is where throttling and working-set numbers come from, so do
# not disable it either: without it the dashboard still draws and some numbers
# are quietly zero, which looks exactly like a system behaving well.
extraScrapeConfigs: |
  # ---- YOUR JOB GOES HERE -------------------------------------------------
  #
  # Two jobs are given to you below. The one that scrapes your own
  # application is not, and stage 3.1 of the lab sheet walks you through
  # writing it: find the pods labelled app=epimetheus, scrape port 8080.
  #
  # cAdvisor is NOT here: the chart ships its own kubernetes-nodes-cadvisor
  # job, which scrapes the same kubelet endpoint. A second one would only
  # duplicate every container series.
  #
  # Add it above this line, at this indentation. Everything under
  # `extraScrapeConfigs:` is one block of text handed to Prometheus as written,
  # so the indentation is part of the meaning.
  # --------------------------------------------------------------------------

  - job_name: pandora
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [pandora]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: pandora
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "9900"

  - job_name: ingress-nginx
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [ingress-nginx]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: metrics
