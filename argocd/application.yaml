# The Argo CD Application that deploys Epimetheus from this repository.
#
# EDIT TWO LINES before applying, both marked REPLACE_ME below:
#
#   spec.source.repoURL            your own repository's URL
#   spec.destination.namespace     the namespace you are deploying into
#
#   kubectl apply -f argocd/application.yaml
#
# Your namespace must already exist, with its ResourceQuota, before you apply
# this. CreateNamespace is off on purpose — see the bottom of the file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: epimetheus
  namespace: argocd
spec:
  project: default

  source:
    # REPLACE_ME — e.g. https://github.com/<you>/<your-repo>.git
    repoURL: REPLACE_ME_WITH_YOUR_REPO_URL
    targetRevision: HEAD
    # Only this directory is deployed. catalog/, argocd/ and pandora/ are run
    # by hand, and Argo CD ignores them.
    path: epimetheus

  destination:
    server: https://kubernetes.default.svc
    # REPLACE_ME — the namespace you created for your deployment.
    namespace: REPLACE_ME_WITH_YOUR_NAMESPACE

  syncPolicy:
    automated:
      # OFF, unlike what you set up last week. With self-heal on, anything you
      # change with kubectl is reverted a few seconds later — a `kubectl scale`
      # would apply and then silently vanish. Off, OutOfSync stands as a
      # reminder that Git does not yet match what is running.
      selfHeal: false

      # Also off: on a half-finished edit, pruning would delete a running
      # Service.
      prune: false

    syncOptions:
      # Your namespace is created during setup, with the ResourceQuota that is
      # your budget. Argo CD would create one without a quota, and nothing
      # would tell you the budget had gone.
      - CreateNamespace=false
